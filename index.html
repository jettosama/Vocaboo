<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life In The UK Vocabulary</title>
    <style>
        :root {
            --primary-color: #4255ff;
            --bg-color: #f6f7fb;
            --card-bg: #ffffff;
            --text-color: #333333;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: center;
        }
        h1 {
            color: var(--primary-color);
            margin-bottom: 5px;
        }
        .archive-stats {
            background: #e3f2fd;
            color: #1565c0;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            margin-bottom: 20px;
            display: inline-block;
        }
        .menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
            margin-bottom: 20px;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }
        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: bold;
        }
        button:hover {
            background-color: #3243d6;
            transform: translateY(-2px);
        }
        .back-btn {
            background-color: #6c757d; 
            margin-bottom: 20px; 
            font-size: 14px; 
            padding: 8px 12px;
            width: 100%;
            max-width: 200px;
        }
        .back-btn:hover {
            background-color: #5a6268;
        }
        
        /* App Areas */
        .app-area {
            display: none;
            margin-top: 20px;
        }
        
        #mainMenu { display: none; } /* Hidden initially while loading */
        #loadingScreen { margin-top: 40px; font-size: 18px; font-weight: bold; color: var(--primary-color); }

        /* Flashcard Styles */
        .flashcard {
            width: 100%;
            max-width: 500px;
            height: 250px;
            perspective: 1000px;
            margin: 0 auto 20px auto;
            cursor: pointer;
        }
        .flashcard-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }
        .flashcard.is-flipped .flashcard-inner {
            transform: rotateX(180deg);
        }
        .flashcard-front, .flashcard-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            padding: 20px;
            box-sizing: border-box;
        }
        .flashcard-front {
            background-color: var(--primary-color);
            color: white;
            font-size: 32px;
            font-weight: bold;
        }
        .flashcard-back {
            background-color: #edf2ff;
            color: var(--text-color);
            transform: rotateX(180deg);
            font-size: 20px;
            border: 2px solid var(--primary-color);
        }
        .flashcard-controls {
            display: flex;
            justify-content: space-between;
            max-width: 500px;
            margin: 20px auto 0 auto;
        }

        /* Quiz Styles */
        .question-card {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            padding: 40px 20px;
            background-color: #edf2ff;
            border-radius: 12px;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            max-width: 600px;
            margin: 0 auto;
        }
        .option-btn {
            background-color: white;
            color: var(--text-color);
            border: 2px solid #e0e0e0;
            padding: 15px;
            text-align: left;
            font-size: 16px;
            transition: all 0.2s;
            font-weight: normal;
        }
        .option-btn:hover {
            border-color: var(--primary-color);
            background-color: #fafbfc;
        }
        .option-btn.correct {
            background-color: #d4edda;
            border-color: #28a745;
            color: #155724;
        }
        .option-btn.wrong {
            background-color: #f8d7da;
            border-color: #dc3545;
            color: #721c24;
        }
        
        /* Match Game Styles */
        .match-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            background-color: #0d0c1e;
            padding: 20px;
            border-radius: 12px;
        }
        .match-card {
            background-color: #2b324d;
            color: white;
            border: 2px solid #434c70;
            border-radius: 8px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .match-card:hover {
            background-color: #394263;
        }
        .match-card.selected {
            background-color: #4255ff;
            border-color: #ffffff;
            transform: scale(1.05);
        }
        .match-card.matched {
            visibility: hidden;
            opacity: 0;
            transition: visibility 0s 0.3s, opacity 0.3s linear;
        }
        .match-card.error {
            background-color: #dc3545;
            border-color: #ff7683;
            animation: shake 0.4s;
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }

        .feedback {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            min-height: 25px;
        }
        .next-btn {
            display: none;
            margin-top: 20px;
            width: 100%;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        .stats {
            margin-top: 20px;
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
        }
        #syncStatus {
            font-size: 12px;
            color: #28a745;
            margin-top: 10px;
            opacity: 0;
            transition: opacity 0.3s;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Life In The UK Vocabulary</h1>
    
    <!-- Loading Screen -->
    <div id="loadingScreen">
        ☁️ Loading cloud progress...
    </div>

    <!-- Main Menu -->
    <div id="mainMenu">
        <div class="archive-stats" id="archiveStats">
            🏆 Words Mastered (Archived): 0
        </div>
        
        <div class="menu-buttons">
            <button onclick="startMode('flashcard')">📖 巩固词汇 (Flashcards)</button>
            <button onclick="startMode('wordToDef')">📝 定义四选一 (Word &rarr; 4 Defs)</button>
            <button onclick="startMode('defToWord')">📝 词汇四选一 (Def &rarr; 4 Words)</button>
            <button onclick="startMode('match')">🧩 配对游戏 (Match Game)</button>
        </div>
        <p id="syncStatus">☁️ Cloud synced successfully!</p>
    </div>

    <!-- Flashcard Area -->
    <div class="app-area" id="flashcardArea">
        <button class="back-btn" onclick="backToMenu()">&larr; Back to Menu</button>
        <div class="stats" id="flashcardStats">Card 1 / 10</div>
        <p style="font-size: 12px; color: #888;">Click the card to flip it!</p>
        
        <div class="flashcard" id="flashcard" onclick="flipCard()">
            <div class="flashcard-inner">
                <div class="flashcard-front" id="flashcardFront">Word</div>
                <div class="flashcard-back" id="flashcardBack">Definition</div>
            </div>
        </div>

        <div class="flashcard-controls">
            <button onclick="prevCard()">&larr; Previous</button>
            <button onclick="nextCard()">Next &rarr;</button>
        </div>
    </div>

    <!-- Quiz Area -->
    <div class="app-area" id="quizArea">
        <button class="back-btn" onclick="backToMenu()">&larr; Back to Menu</button>
        <div class="stats" id="quizStats">Question 1 / 10 | Score: 0</div>
        
        <div class="question-card" id="questionText">Word goes here</div>
        <div class="options-grid" id="optionsGrid"></div>

        <div class="feedback" id="quizFeedback"></div>
        <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Next Question</button>
    </div>

    <!-- Match Game Area -->
    <div class="app-area" id="matchArea">
        <button class="back-btn" onclick="backToMenu()">&larr; Back to Menu</button>
        <p>Match the word to its definition to clear the board!</p>
        <div class="match-grid" id="matchGrid"></div>
        <div class="feedback" id="matchFeedback"></div>
    </div>
</div>

<script>
    // ==========================================
    // ☁️ CLOUD DATABASE SETTINGS ☁️
    // ==========================================
    // REPLACE THIS URL WITH YOUR GOOGLE WEB APP URL
    const CLOUD_URL = "https://script.google.com/macros/s/AKfycbxKY3DF79O6vi4PqAsa6pvn3QFvXveYee0ADP_l7snZYRZdN2HSiROYyDsK1KzlBQv_hg/exec
        "; 
    // ==========================================

    const masterVocabularyList = [
        { word: "Trouble", definition: "问题" },
        { word: "Gaelic", definition: "盖尔语" },
        { word: "Coalition", definition: "联盟" },
        { word: "Education Act", definition: "教育法" },
        { word: "Invade", definition: "侵略" },
        { word: "Colony", definition: "殖民地" },
        { word: "Invention", definition: "创造" },
        { word: "Agree", definition: "同意" },
        { word: "Land", definition: "地" },
        { word: "Mark", definition: "标" },
        { word: "Eden", definition: "伊甸园" },
        { word: "Voting", definition: "投票" },
        { word: "Compulsory", definition: "必须的" },
        { word: "Prisoner", definition: "囚犯" },
        { word: "Criminal", definition: "犯罪" },
        { word: "Goods", definition: "物品" },
        { word: "Racial", definition: "种族上的" },
        { word: "Electoral", definition: "公投" },
        { word: "Registration", definition: "注册" },
        { word: "Eligible", definition: "有资格的" },
        { word: "Principle", definition: "原则 / 原理" },
        { word: "Fundamental", definition: "基本的 / 根本的" },
        { word: "Monarch", definition: "君主" },
        { word: "Skyscraper", definition: "摩天大楼" },
        { word: "Aeroplanes", definition: "飞机" },
        { word: "Execute / Execution", definition: "执行 / 处决" },
        { word: "Suppressed", definition: "镇压 / 压制" },
        { word: "Annexed", definition: "吞并 / 兼并" },
        { word: "Allotment", definition: "分配 / 份额" },
        { word: "Discrimination", definition: "歧视" },
        { word: "Vehicle", definition: "车辆 / 交通工具" },
        { word: "Dependency", definition: "依赖 / 附属国" },
        { word: "Development", definition: "发展 / 开发" },
        { word: "Orientation", definition: "方向 / 定位" },
        { word: "Catholic", definition: "天主教" },
        { word: "Protestants", definition: "新教" },
        { word: "Crime", definition: "犯罪" },
        { word: "Tradition", definition: "传统" },
        { word: "Admiral", definition: "海军上将" },
        { word: "Associate", definition: "有关联" },
        { word: "Labour", definition: "工党（劳动）" },
        { word: "Invasion", definition: "侵略" },
        { word: "Colonel", definition: "上校" },
        { word: "Julius Caesar", definition: "凯撒" },
        { word: "Rugby", definition: "橄榄球" },
        { word: "Film", definition: "电影" },
        { word: "Court", definition: "法庭" },
        { word: "Youth", definition: "青少年" },
        { word: "Judge", definition: "法官" },
        { word: "Jury", definition: "陪审团" },
        { word: "Domestic violence", definition: "家庭暴力" },
        { word: "Refuge", definition: "避难所" },
        { word: "Method", definition: "方法" },
        { word: "Farming", definition: "农业，种植" },
        { word: "Casualties", definition: "伤亡" },
        { word: "Playwright", definition: "剧作家" },
        { word: "War of the roses", definition: "玫瑰之战" }
    ];

    const WORDS_PER_ROUND = 10;
    const MASTERY_TARGET = 5;

    let localProgress = {};
    let roundVocab = [];
    let currentMode = '';
    let currentIndex = 0;
    let score = 0;
    let hasAnswered = false;
    let isFirstTry = true;

    // --- Automatic Cloud Fetch on Load ---
    window.onload = async function() {
        try {
            const response = await fetch(CLOUD_URL);
            localProgress = await response.json();
            
            document.getElementById('loadingScreen').style.display = 'none';
            document.getElementById('mainMenu').style.display = 'block';
            updateArchiveStats();
        } catch (error) {
            document.getElementById('loadingScreen').innerText = "❌ Cloud connection failed. Please refresh.";
            document.getElementById('loadingScreen').style.color = "#dc3545";
        }
    };

    async function syncToCloud() {
        document.getElementById('syncStatus').style.opacity = '1';
        document.getElementById('syncStatus').innerText = "☁️ Syncing...";
        
        try {
            await fetch(CLOUD_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ progress: localProgress })
            });
            document.getElementById('syncStatus').innerText = "☁️ Cloud synced successfully!";
        } catch (error) {
            document.getElementById('syncStatus').innerText = "❌ Cloud sync failed. Will retry later.";
            document.getElementById('syncStatus').style.color = "#dc3545";
        }
        
        setTimeout(() => { document.getElementById('syncStatus').style.opacity = '0'; }, 3000);
    }

    function incrementMastery(word) {
        if (!localProgress[word]) localProgress[word] = 0;
        localProgress[word]++;
        updateArchiveStats();
        syncToCloud(); 
    }

    function updateArchiveStats() {
        let masteredCount = Object.values(localProgress).filter(count => count >= MASTERY_TARGET).length;
        document.getElementById('archiveStats').innerText = `🏆 Words Mastered (Archived): ${masteredCount}`;
    }

    function shuffleArray(array) {
        const arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function setupRoundVocab() {
        let availableVocab = masterVocabularyList.filter(item => {
            return (localProgress[item.word] || 0) < MASTERY_TARGET;
        });

        if (availableVocab.length === 0) {
            alert("Amazing! You have mastered all the words! We will review them all now.");
            availableVocab = [...masterVocabularyList];
        }

        roundVocab = shuffleArray(availableVocab).slice(0, WORDS_PER_ROUND);
    }

    function backToMenu() {
        document.querySelectorAll('.app-area').forEach(el => el.style.display = 'none');
        document.getElementById('mainMenu').style.display = 'block';
        updateArchiveStats();
    }

    function startMode(mode) {
        setupRoundVocab();
        document.getElementById('mainMenu').style.display = 'none';
        
        currentMode = mode;
        if (mode === 'flashcard') startFlashcards();
        else if (mode === 'wordToDef' || mode === 'defToWord') startQuiz();
        else if (mode === 'match') startMatch();
    }

    function startFlashcards() {
        currentIndex = 0;
        document.getElementById('flashcardArea').style.display = 'block';
        document.getElementById('flashcard').classList.remove('is-flipped');
        updateFlashcard();
    }

    function updateFlashcard() {
        document.getElementById('flashcardStats').innerText = `Card ${currentIndex + 1} of ${roundVocab.length}`;
        document.getElementById('flashcardFront').innerText = roundVocab[currentIndex].word;
        document.getElementById('flashcardBack').innerText = roundVocab[currentIndex].definition;
    }

    function flipCard() {
        document.getElementById('flashcard').classList.toggle('is-flipped');
    }

    function nextCard() {
        if (currentIndex < roundVocab.length - 1) {
            document.getElementById('flashcard').classList.remove('is-flipped');
            setTimeout(() => {
                currentIndex++;
                updateFlashcard();
            }, 150);
        } else {
            alert("You've finished reviewing this round!");
            backToMenu();
        }
    }

    function prevCard() {
        if (currentIndex > 0) {
            document.getElementById('flashcard').classList.remove('is-flipped');
            setTimeout(() => {
                currentIndex--;
                updateFlashcard();
            }, 150);
        }
    }

    function startQuiz() {
        currentIndex = 0;
        score = 0;
        document.getElementById('quizArea').style.display = 'block';
        loadQuestion();
    }

    function loadQuestion() {
        hasAnswered = false;
        isFirstTry = true;
        document.getElementById('nextBtn').style.display = 'none';
        document.getElementById('quizFeedback').innerText = '';
        document.getElementById('quizStats').innerText = `Question ${currentIndex + 1} of ${roundVocab.length} | Score: ${score}`;

        const currentItem = roundVocab[currentIndex];

        let options = [currentItem];
        let wrongOptions = masterVocabularyList.filter(item => item.word !== currentItem.word);
        wrongOptions = shuffleArray(wrongOptions).slice(0, 3);
        options = shuffleArray(options.concat(wrongOptions)); 

        const questionText = document.getElementById('questionText');
        const optionsGrid = document.getElementById('optionsGrid');
        optionsGrid.innerHTML = ''; 

        if (currentMode === 'wordToDef') {
            questionText.innerText = currentItem.word;
            questionText.style.fontSize = "32px"; 
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt.definition;
                btn.onclick = () => checkAnswer(opt, btn, currentItem);
                optionsGrid.appendChild(btn);
            });
        } else {
            questionText.innerText = currentItem.definition;
            questionText.style.fontSize = "24px"; 
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt.word;
                btn.onclick = () => checkAnswer(opt, btn, currentItem);
                optionsGrid.appendChild(btn);
            });
        }
    }

    function checkAnswer(selectedOption, buttonElement, currentCorrectAnswer) {
        if (hasAnswered) return;

        const isCorrect = selectedOption.word === currentCorrectAnswer.word;
        const feedbackEl = document.getElementById('quizFeedback');

        if (isCorrect) {
            buttonElement.classList.add('correct');
            feedbackEl.innerText = "✅ Correct!";
            feedbackEl.style.color = "#28a745";
            hasAnswered = true;
            
            if (isFirstTry) {
                score++;
                incrementMastery(currentCorrectAnswer.word); 
            }

            const nextBtn = document.getElementById('nextBtn');
            nextBtn.style.display = 'block';
            nextBtn.innerText = (currentIndex >= roundVocab.length - 1) ? "See Results" : "Next Question";

        } else {
            buttonElement.classList.add('wrong');
            feedbackEl.innerText = "❌ Try again!";
            feedbackEl.style.color = "#dc3545";
            isFirstTry = false;
        }

        document.getElementById('quizStats').innerText = `Question ${currentIndex + 1} of ${roundVocab.length} | Score: ${score}`;
    }

    function nextQuestion() {
        currentIndex++;
        if (currentIndex < roundVocab.length) {
            loadQuestion();
        } else {
            document.getElementById('questionText').innerText = `Round Complete! 🎉`;
            document.getElementById('optionsGrid').innerHTML = '';
            document.getElementById('quizFeedback').innerText = `You scored ${score} out of ${roundVocab.length} on the first try!`;
            document.getElementById('quizFeedback').style.color = "var(--text-color)";
            document.getElementById('nextBtn').style.display = 'none';
        }
    }

    let matchSelection = [];
    let matchedPairs = 0;

    function startMatch() {
        document.getElementById('matchArea').style.display = 'block';
        document.getElementById('matchFeedback').innerText = '';
        matchSelection = [];
        matchedPairs = 0;
        
        const grid = document.getElementById('matchGrid');
        grid.innerHTML = '';

        const pairsCount = Math.min(6, roundVocab.length);
        let matchVocab = roundVocab.slice(0, pairsCount);

        let cardsData = [];
        matchVocab.forEach(item => {
            cardsData.push({ text: item.word, matchId: item.word, type: 'word' });
            cardsData.push({ text: item.definition, matchId: item.word, type: 'def' });
        });

        cardsData = shuffleArray(cardsData);

        cardsData.forEach(data => {
            let card = document.createElement('div');
            card.className = 'match-card';
            card.innerText = data.text;
            card.onclick = () => selectMatchCard(card, data);
            grid.appendChild(card);
        });
    }

    function selectMatchCard(cardElement, data) {
        if (cardElement.classList.contains('matched') || 
            cardElement.classList.contains('selected') || 
            matchSelection.length >= 2) {
            return;
        }

        cardElement.classList.add('selected');
        matchSelection.push({ element: cardElement, data: data });

        if (matchSelection.length === 2) {
            checkMatch();
        }
    }

    function checkMatch() {
        const card1 = matchSelection[0];
        const card2 = matchSelection[1];

        const isMatch = (card1.data.matchId === card2.data.matchId) && (card1.data.type !== card2.data.type);

        if (isMatch) {
            setTimeout(() => {
                card1.element.classList.replace('selected', 'matched');
                card2.element.classList.replace('selected', 'matched');
                incrementMastery(card1.data.matchId);
                matchedPairs++;
                
                const pairsCount = Math.min(6, roundVocab.length);
                if (matchedPairs === pairsCount) {
                    document.getElementById('matchFeedback').innerText = "🎉 All matched! Great job!";
                    document.getElementById('matchFeedback').style.color = "#28a745";
                }
            }, 400);
        } else {
            card1.element.classList.add('error');
            card2.element.classList.add('error');
            setTimeout(() => {
                card1.element.classList.remove('selected', 'error');
                card2.element.classList.remove('selected', 'error');
            }, 800);
        }
        matchSelection = [];
    }
</script>
</body>
</html>
